<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tarayıcıda oynanan Tetris." />
    <title>Tetris — Ali Kerem Oyunları</title>
  </head>
  <body>
    <div class="game-shell">
      <header class="game-top">
        <a class="btn" href="../../index.html">← Ana sayfa</a>
        <div class="scores">
          <div class="score-box" id="score-box">
            <span>SKOR</span>
            <strong id="score">0</strong>
            <div class="score-gain" id="score-gain"></div>
          </div>
          <div class="score-box">
            <span>EN İYİ</span>
            <strong id="best">0</strong>
            <small id="best-name"></small>
          </div>
        </div>
      </header>

      <div class="game-intro">
        <div>
          <h1>Tetris</h1>
          <p>Düşen blokları çevir, satırları doldurup temizle.</p>
        </div>
        <button class="btn btn--accent" id="restart" type="button">Yeni oyun</button>
      </div>

      <div class="status-row">
        <span class="status-chip">Seviye <b id="level">1</b></span>
        <span class="status-chip">Satır <b id="lines">0</b></span>
      </div>

      <div class="game-stage" id="game-stage">
        <div class="game-canvas" id="game"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <form class="overlay-form" id="overlay-form" hidden>
              <label for="overlay-name">Tabloya yazılacak ad</label>
              <div class="row">
                <input id="overlay-name" name="nick" type="text" autocomplete="nickname"
                  placeholder="Adını yaz" enterkeyhint="done" />
                <button class="btn btn--accent" id="overlay-submit" type="submit">Kaydet</button>
              </div>
            </form>
            <div class="overlay-actions">
              <button class="btn btn--accent" id="overlay-primary" type="button"></button>
              <button class="btn" id="overlay-secondary" type="button" hidden></button>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar" id="pad">
        <button class="btn" type="button" data-move="left">←</button>
        <button class="btn" type="button" data-move="rotate">⟳</button>
        <button class="btn" type="button" data-move="right">→</button>
        <button class="btn" type="button" data-move="soft">↓</button>
        <button class="btn" type="button" data-move="drop">⇓ Bırak</button>
      </div>

      <p class="hint"><kbd>←</kbd> <kbd>→</kbd> kaydır · <kbd>↑</kbd> çevir · <kbd>↓</kbd> hızlandır · <kbd>Boşluk</kbd> bırak · <kbd>P</kbd> duraklat · mobilde alttaki tuşlar veya kaydırma</p>

      <section class="scoreboard" id="scoreboard" hidden>
        <h2>Skor tablosu — bu cihaz</h2>
        <ol id="scoreboard-list"></ol>
      </section>
    </div>

    <script type="module" src="../../src/games/tetris/main.ts"></script>
  </body>
</html>
