<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tarayıcıda oynanan kelime bulmaca." />
    <title>Kelime Bulmaca — Ali Kerem Oyunları</title>
  </head>
  <body>
    <div class="game-shell">
      <header class="game-top">
        <div class="left">
          <a class="btn" href="../../index.html">←&nbsp;<span class="uzun">Ana sayfa</span></a>
          <button class="btn btn--icon" id="sound" type="button" aria-label="Sesi aç veya kapat" aria-pressed="true">🔊</button>
        </div>
        <div class="scores">
          <div class="score-box" id="score-box">
            <span>SKOR</span>
            <strong id="score">0</strong>
            <div class="score-gain" id="score-gain"></div>
          </div>
          <div class="score-box">
            <span>EN İYİ</span>
            <strong id="best">0</strong>
            <small id="best-name"></small>
          </div>
        </div>
      </header>

      <div class="game-intro">
        <div>
          <h1>Kelime Bulmaca</h1>
          <p>İpuçlarını oku, kesişen kelimeleri harf harf doldur.</p>
        </div>
        <button class="btn btn--accent" id="restart" type="button">Yeni oyun</button>
      </div>

      <div class="status-row">
        <span class="status-chip">Kalan kelime <b id="remaining">0</b></span>
        <span class="status-chip">Süre <b id="timer">0</b></span>
      </div>

      <div class="game-stage" id="game-stage">
        <div class="game-canvas" id="game"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <form class="overlay-form" id="overlay-form" hidden>
              <label for="overlay-name">Tabloya yazılacak ad</label>
              <div class="row">
                <input id="overlay-name" name="nick" type="text" autocomplete="nickname"
                  placeholder="Adını yaz" enterkeyhint="done" />
                <button class="btn btn--accent" id="overlay-submit" type="submit">Kaydet</button>
              </div>
            </form>
            <div class="overlay-actions">
              <button class="btn btn--accent" id="overlay-primary" type="button"></button>
              <button class="btn" id="overlay-secondary" type="button" hidden></button>
            </div>
          </div>
        </div>
      </div>

      <div id="keypad"></div>

      <section class="panel" id="clues">
        <h2>İpuçları</h2>
        <div class="columns">
          <div><h2>Soldan sağa</h2><ul class="clue-list" id="clues-across"></ul></div>
          <div><h2>Yukarıdan aşağıya</h2><ul class="clue-list" id="clues-down"></ul></div>
        </div>
      </section>

      <p class="hint">Kareye dokun, sonra harf seç · klavyeden de yazabilirsin · <kbd>Boşluk</kbd> yönü değiştirir</p>

      <section class="scoreboard" id="scoreboard" hidden>
        <h2>Skor tablosu — bu cihaz</h2>
        <ol id="scoreboard-list"></ol>
      </section>
    </div>

    <script type="module" src="../../src/games/bulmaca/main.ts"></script>
  </body>
</html>
