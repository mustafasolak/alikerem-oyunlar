<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Klasik Hanoi kuleleri bulmacası." />
    <title>Hanoi Kuleleri — Ali Kerem Oyunları</title>
  </head>
  <body>
    <div class="game-shell">
      <header class="game-top">
        <div class="left">
          <a class="btn" href="../../index.html">←&nbsp;<span class="uzun">Ana sayfa</span></a>
          <button class="btn btn--icon" id="sound" type="button" aria-label="Sesi aç veya kapat" aria-pressed="true">🔊</button>
        </div>
        <div class="scores">
          <div class="score-box" id="score-box">
            <span>SKOR</span>
            <strong id="score">0</strong>
            <div class="score-gain" id="score-gain"></div>
          </div>
          <div class="score-box">
            <span>EN İYİ</span>
            <strong id="best">0</strong>
            <small id="best-name"></small>
          </div>
        </div>
      </header>

      <div class="game-intro">
        <div>
          <h1>Hanoi Kuleleri</h1>
          <p>Diskleri son çubuğa taşı; büyük disk küçüğün üstüne gelemez.</p>
        </div>
        <button class="btn btn--accent" id="restart" type="button">Yeni oyun</button>
      </div>

      <div class="toolbar" id="toolbar">
        <button class="btn" type="button" data-level="3" aria-pressed="true">3 disk</button>
        <button class="btn" type="button" data-level="4" aria-pressed="false">4 disk</button>
        <button class="btn" type="button" data-level="5" aria-pressed="false">5 disk</button>
        <button class="btn" type="button" data-level="6" aria-pressed="false">6 disk</button>
      </div>

      <div class="status-row">
        <span class="status-chip">Hamle <b id="moves">0</b></span>
        <span class="status-chip">En az <b id="best-moves">7</b></span>
      </div>

      <div class="game-stage" id="game-stage">
        <div class="game-canvas" id="game"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <form class="overlay-form" id="overlay-form" hidden>
              <label for="overlay-name">Tabloya yazılacak ad</label>
              <div class="row">
                <input id="overlay-name" name="nick" type="text" autocomplete="nickname"
                  placeholder="Adını yaz" enterkeyhint="done" />
                <button class="btn btn--accent" id="overlay-submit" type="submit">Kaydet</button>
              </div>
            </form>
            <div class="overlay-actions">
              <button class="btn btn--accent" id="overlay-primary" type="button"></button>
              <button class="btn" id="overlay-secondary" type="button" hidden></button>
            </div>
          </div>
        </div>
      </div>

      <p class="hint">Diski al, hedef çubuğa dokun · büyük disk küçüğün üstüne konamaz</p>

      <section class="scoreboard" id="scoreboard" hidden>
        <h2>Skor tablosu — bu cihaz</h2>
        <ol id="scoreboard-list"></ol>
      </section>
    </div>

    <script type="module" src="../../src/games/hanoi/main.ts"></script>
  </body>
</html>
